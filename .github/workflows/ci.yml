name: Windows x64

on:
  push:
    branches: [platform/windows-1.1.0, platform/windows-1.1.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Run Windows regression tests
        run: pnpm test:windows:regression
      - name: Build and package Windows x64
        run: |
          pnpm build
          pnpm package:windows
      - name: Install and test the Windows archive
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'taskquay-unpacked'
          $installed = Join-Path $env:RUNNER_TEMP 'taskquay-installed'
          Expand-Archive -LiteralPath 'releases/taskquay-windows-x64.zip' -DestinationPath $unpacked
          & "$unpacked/taskquay-windows-x64/install-windows.ps1" -Destination $installed -ConfigDirectory (Join-Path $env:RUNNER_TEMP 'taskquay-config')
          $env:TASKQUAY_TEST_AGENT_FIXTURE = '1'
          & "$installed/runtime/node.exe" 'scripts/acceptance-windows.mjs' "$installed/app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: taskquay-windows-x64
          path: |
            releases/taskquay-windows-x64.zip
            releases/taskquay-windows-x64.zip.sha256
          if-no-files-found: error
